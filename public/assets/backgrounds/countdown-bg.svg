<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="countBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#182747" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0e172e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="orbitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#996515" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#countBg)"/>

  <!-- Celestial Astrological Time Rings -->
  <g transform="translate(960, 540)">
    <circle cx="0" cy="0" r="500" stroke="url(#orbitGold)" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="0" cy="0" r="420" stroke="url(#orbitGold)" stroke-width="1"/>
    <circle cx="0" cy="0" r="320" stroke="url(#orbitGold)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="220" stroke="url(#orbitGold)" stroke-width="1"/>

    <!-- Dial Tick Marks (24 divisions) -->
    <g stroke="#d4af37" stroke-width="1.5" opacity="0.25">
      <line x1="0" y1="-420" x2="0" y2="-400" />
      <line x1="0" y1="420" x2="0" y2="400" />
      <line x1="-420" y1="0" x2="-400" y2="0" />
      <line x1="420" y1="0" x2="400" y2="0" />
      <line x1="297" y1="297" x2="283" y2="283" />
      <line x1="-297" y1="297" x2="-283" y2="283" />
      <line x1="297" y1="-297" x2="283" y2="-283" />
      <line x1="-297" y1="-297" x2="-283" y2="-283" />
    </g>
  </g>

  <!-- Constellations & Cosmic Stars -->
  <g fill="#ffd700" opacity="0.5">
    <circle cx="280" cy="180" r="2" />
    <circle cx="340" cy="240" r="1.5" />
    <circle cx="420" cy="210" r="2.5" />
    <line x1="280" y1="180" x2="340" y2="240" stroke="#ffd700" stroke-width="0.5" opacity="0.4"/>
    <line x1="340" y1="240" x2="420" y2="210" stroke="#ffd700" stroke-width="0.5" opacity="0.4"/>

    <circle cx="1600" cy="800" r="2" />
    <circle cx="1680" cy="740" r="1.8" />
    <circle cx="1740" cy="820" r="2.2" />
    <line x1="1600" y1="800" x2="1680" y2="740" stroke="#ffd700" stroke-width="0.5" opacity="0.4"/>
    <line x1="1680" y1="740" x2="1740" y2="820" stroke="#ffd700" stroke-width="0.5" opacity="0.4"/>
  </g>
</svg>

