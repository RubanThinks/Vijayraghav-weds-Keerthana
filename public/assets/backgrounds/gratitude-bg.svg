<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="gratitudeGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d0a33" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#200522" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#0a1024" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#04060e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4e4b5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#gratitudeGlow)"/>
  <rect width="100%" height="100%" fill="url(#warmLight)"/>

  <!-- Floral Filigree Silhouette at bottom corners -->
  <g opacity="0.15" stroke="#d4af37" stroke-width="2" fill="none">
    <!-- Bottom Left Garland Arch -->
    <path d="M 0 1080 C 180 980, 320 850, 400 680 C 420 800, 380 950, 0 1080 Z"/>
    <!-- Bottom Right Garland Arch -->
    <path d="M 1920 1080 C 1740 980, 1600 850, 1520 680 C 1500 800, 1540 950, 1920 1080 Z"/>
  </g>

  <!-- Golden Stardust / Confetti -->
  <g fill="#ffd700" opacity="0.6">
    <circle cx="850" cy="400" r="2"/>
    <circle cx="1070" cy="420" r="1.8"/>
    <circle cx="960" cy="310" r="2.5"/>
    <circle cx="780" cy="580" r="2.2"/>
    <circle cx="1140" cy="560" r="2"/>
    <circle cx="960" cy="720" r="1.5"/>
  </g>
</svg>

