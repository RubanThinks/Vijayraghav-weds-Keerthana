<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="heroCenterGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#360a35" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#19062b" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#0b1329" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldHaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Plum/Navy Background -->
  <rect width="100%" height="100%" fill="url(#heroCenterGlow)"/>

  <!-- Subtle Gold Radial Haze -->
  <rect width="100%" height="100%" fill="url(#goldHaze)"/>

  <!-- Sacred Geometry / Kolam in Background -->
  <g opacity="0.07" stroke="#d4af37" stroke-width="1.5">
    <circle cx="960" cy="480" r="450" stroke-dasharray="10 10"/>
    <circle cx="960" cy="480" r="380"/>
    <circle cx="960" cy="480" r="280" stroke-dasharray="6 6"/>
    <circle cx="960" cy="480" r="150"/>
  </g>

  <!-- Distant Starlight / Sparkles -->
  <g fill="#ffd700" opacity="0.45">
    <circle cx="200" cy="180" r="1.5" />
    <circle cx="340" cy="280" r="2" />
    <circle cx="1600" cy="220" r="1.8" />
    <circle cx="1750" cy="350" r="1.2" />
    <circle cx="480" cy="680" r="1.5" />
    <circle cx="1450" cy="720" r="2" />
    <circle cx="820" cy="150" r="1.6" />
    <circle cx="1120" cy="140" r="1.8" />
  </g>
</svg>

