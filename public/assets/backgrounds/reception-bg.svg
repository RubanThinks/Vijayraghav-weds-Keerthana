<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="recpBg" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4a0e28" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#2a0824" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#0e172e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060914" stop-opacity="1"/>
    </radialGradient>
    <filter id="bokehBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#recpBg)"/>

  <!-- Golden Evening Bokeh & Fairy Lights -->
  <g filter="url(#bokehBlur)" opacity="0.35">
    <circle cx="300" cy="250" r="80" fill="#ffd700"/>
    <circle cx="550" cy="180" r="110" fill="#f4a261"/>
    <circle cx="850" cy="320" r="95" fill="#ffd700"/>
    <circle cx="1200" cy="220" r="120" fill="#e76f51"/>
    <circle cx="1500" cy="340" r="85" fill="#f4e4b5"/>
    <circle cx="1700" cy="180" r="100" fill="#ffd700"/>
    <circle cx="700" cy="750" r="130" fill="#e76f51"/>
    <circle cx="1350" cy="800" r="110" fill="#ffd700"/>
  </g>

  <!-- Hanging Golden Crystal Fairy Light Strings -->
  <g stroke="#d4af37" stroke-width="1" opacity="0.25">
    <line x1="200" y1="0" x2="200" y2="280" stroke-dasharray="2 12"/>
    <circle cx="200" cy="280" r="4" fill="#ffd700"/>
    
    <line x1="450" y1="0" x2="450" y2="200" stroke-dasharray="2 12"/>
    <circle cx="450" cy="200" r="3.5" fill="#ffd700"/>

    <line x1="800" y1="0" x2="800" y2="350" stroke-dasharray="2 12"/>
    <circle cx="800" cy="350" r="5" fill="#ffd700"/>

    <line x1="1150" y1="0" x2="1150" y2="240" stroke-dasharray="2 12"/>
    <circle cx="1150" cy="240" r="4" fill="#ffd700"/>

    <line x1="1500" y1="0" x2="1500" y2="310" stroke-dasharray="2 12"/>
    <circle cx="1500" cy="310" r="4.5" fill="#ffd700"/>

    <line x1="1750" y1="0" x2="1750" y2="220" stroke-dasharray="2 12"/>
    <circle cx="1750" cy="220" r="3.5" fill="#ffd700"/>
  </g>
</svg>

