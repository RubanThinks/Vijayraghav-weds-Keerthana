<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Brahma Muhurtham sacred sunrise glow -->
    <radialGradient id="muhurthamDawn" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#7a2410" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#4d0e26" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#240728" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c1a" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm golden sunrise beam -->
    <linearGradient id="dawnRays" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#f77f00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="agniWarmth" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#fca311" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#e63946" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Sacred Base -->
  <rect width="100%" height="100%" fill="url(#muhurthamDawn)"/>
  <rect width="100%" height="100%" fill="url(#dawnRays)"/>
  <rect width="100%" height="100%" fill="url(#agniWarmth)"/>

  <!-- Subtle Auspicious South Indian Kolam Pattern in Center -->
  <g opacity="0.06" stroke="#ffd700" stroke-width="2">
    <circle cx="960" cy="540" r="500"/>
    <circle cx="960" cy="540" r="350"/>
    <circle cx="960" cy="540" r="200"/>
    <line x1="460" y1="540" x2="1460" y2="540"/>
    <line x1="960" y1="40" x2="960" y2="1040"/>
  </g>

  <!-- Golden Floating Sparks / Agni Embers -->
  <g fill="#ffd700" opacity="0.6">
    <circle cx="940" cy="850" r="2" />
    <circle cx="980" cy="810" r="1.5" />
    <circle cx="910" cy="760" r="1.8" />
    <circle cx="1030" cy="780" r="2.2" />
    <circle cx="890" cy="690" r="1.5" />
    <circle cx="1060" cy="670" r="1.8" />
    <circle cx="960" cy="620" r="2" />
  </g>
</svg>

