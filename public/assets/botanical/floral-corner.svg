<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6819"/>
    </linearGradient>
  </defs>

  <!-- Corner L-Frames -->
  <path d="M 10 190 L 10 10 L 190 10" stroke="url(#cornerGold)" stroke-width="2.5" fill="none"/>
  <path d="M 22 170 L 22 22 L 170 22" stroke="url(#cornerGold)" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- Corner Flourish / Filigree -->
  <path d="M 10 10 Q 55 15 70 50 Q 80 80 50 70 Q 20 60 10 10 Z" fill="none" stroke="url(#cornerGold)" stroke-width="1.8"/>
  <circle cx="10" cy="10" r="4" fill="url(#cornerGold)"/>
  <circle cx="22" cy="22" r="3" fill="url(#cornerGold)"/>
  
  <!-- Botanical leaf sprout in corner -->
  <path d="M 25 25 C 45 40, 50 65, 35 75 C 25 60, 20 40, 25 25 Z" fill="url(#cornerGold)" opacity="0.8"/>
  <path d="M 25 25 C 40 45, 65 50, 75 35 C 60 25, 40 20, 25 25 Z" fill="url(#cornerGold)" opacity="0.8"/>
  <circle cx="45" cy="45" r="3" fill="#fff" opacity="0.9"/>
</svg>

