<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="brideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240722"/>
      <stop offset="50%" stop-color="#3d0e37"/>
      <stop offset="100%" stop-color="#140316"/>
    </linearGradient>
    <linearGradient id="goldBorderB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6112"/>
    </linearGradient>
    <linearGradient id="silkSaree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a01a38"/>
      <stop offset="50%" stop-color="#800f2f"/>
      <stop offset="100%" stop-color="#590d22"/>
    </linearGradient>
    <linearGradient id="brideSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae0cb"/>
      <stop offset="100%" stop-color="#eec7aa"/>
    </linearGradient>
  </defs>

  <!-- Editorial Background -->
  <rect width="100%" height="100%" fill="url(#brideBg)"/>

  <!-- Ornate Frame -->
  <rect x="25" y="25" width="550" height="750" stroke="url(#goldBorderB)" stroke-width="2" fill="none"/>
  <rect x="35" y="35" width="530" height="730" stroke="url(#goldBorderB)" stroke-width="0.8" stroke-dasharray="6 4" fill="none"/>

  <!-- Bride Illustration in Traditional Kanchipuram Silk & Temple Jewelry -->
  <g id="brideFigure" transform="translate(300, 360)">
    <!-- Fragrant Jasmine (Malli) Floral Garland around Hairstyle -->
    <path d="M -70 -70 C -90 -20, -80 60, -75 140" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" stroke-dasharray="2 12"/>

    <!-- Silk Blouse & Pleated Saree Pallu with Heavy Golden Brocade -->
    <path d="M -150 300 L -110 115 C -65 85, 65 85, 110 115 L 150 300 Z" fill="url(#silkSaree)" stroke="url(#goldBorderB)" stroke-width="2"/>

    <!-- Gold Brocade Zari Border Pallu draped over shoulder -->
    <path d="M 40 100 C 60 170, 75 250, 110 390 L 160 380 C 130 260, 100 170, 85 95 Z" fill="#ffd700" stroke="url(#goldBorderB)" stroke-width="2"/>
    <line x1="55" y1="120" x2="95" y2="115" stroke="#8a6112" stroke-width="2"/>
    <line x1="70" y1="180" x2="115" y2="175" stroke="#8a6112" stroke-width="2"/>
    <line x1="85" y1="260" x2="135" y2="255" stroke="#8a6112" stroke-width="2"/>

    <!-- Neck & Face -->
    <path d="M -26 50 L -26 100 C -10 108, 10 108, 26 100 L 26 50 Z" fill="url(#brideSkin)"/>
    <path d="M -45 -50 C -55 10, -40 55, 0 60 C 40 55, 55 10, 45 -50 C 35 -75, -35 -75, -45 -50 Z" fill="url(#brideSkin)"/>

    <!-- Bride Hair / Kondai -->
    <path d="M -50 -45 C -50 -95, 50 -95, 50 -45 C 45 -65, -45 -65, -50 -45 Z" fill="#1b1715"/>
    <path d="M -48 -45 C -45 5, -35 25, -30 35" stroke="#1b1715" stroke-width="3" fill="none"/>
    <path d="M 48 -45 C 45 5, 35 25, 30 35" stroke="#1b1715" stroke-width="3" fill="none"/>

    <!-- Traditional Maang Tikka (Nethi Chutti) -->
    <line x1="0" y1="-75" x2="0" y2="-45" stroke="url(#goldBorderB)" stroke-width="2"/>
    <circle cx="0" cy="-45" r="4.5" fill="url(#goldBorderB)"/>
    <circle cx="0" cy="-45" r="2.5" fill="#d90429"/>

    <!-- Radiant Vermilion Bindi (Pottu) -->
    <circle cx="0" cy="-33" r="3" fill="#c1121f"/>

    <!-- Graceful Eyes with Kohl (Mai) & Smile -->
    <path d="M -30 -18 Q -18 -24 -8 -18" stroke="#1b1715" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 8 -18 Q 18 -24 30 -18" stroke="#1b1715" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-19" cy="-12" r="3.2" fill="#20130e"/>
    <circle cx="19" cy="-12" r="3.2" fill="#20130e"/>
    <path d="M -12 24 Q 0 34 12 24" stroke="#c1121f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Temple Gold Choker & Mango Haram (Maanga Malai) -->
    <path d="M -25 80 Q 0 95 25 80" stroke="url(#goldBorderB)" stroke-width="4" fill="none"/>
    <circle cx="0" cy="98" r="5" fill="#d90429" stroke="#ffd700" stroke-width="1.5"/>

    <path d="M -45 100 Q 0 160 45 100" stroke="url(#goldBorderB)" stroke-width="3.5" fill="none" stroke-dasharray="6 3"/>

    <!-- Jhumkas (Jimikki) Ear Ornaments -->
    <circle cx="-42" cy="0" r="3" fill="url(#goldBorderB)"/>
    <path d="M -47 8 L -37 8 L -42 16 Z" fill="url(#goldBorderB)"/>
    <circle cx="42" cy="0" r="3" fill="url(#goldBorderB)"/>
    <path d="M 37 8 L 47 8 L 42 16 Z" fill="url(#goldBorderB)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 710)">
    <rect x="-140" y="-35" width="280" height="50" rx="4" fill="#060a14" stroke="url(#goldBorderB)" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="url(#goldBorderB)" text-anchor="middle" letter-spacing="3">KEERTHANA</text>
    <text x="0" y="10" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#f4e4b5" text-anchor="middle" letter-spacing="4">THE BRIDE</text>
  </g>
</svg>

