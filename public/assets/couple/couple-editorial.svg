<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#240722"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>
    <linearGradient id="coupleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6112"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#cGrad)"/>

  <!-- Ornate Border -->
  <rect x="20" y="20" width="960" height="610" stroke="url(#coupleGold)" stroke-width="2" fill="none"/>
  <rect x="32" y="32" width="936" height="586" stroke="url(#coupleGold)" stroke-width="0.8" stroke-dasharray="6 4" fill="none"/>

  <!-- Botanical corner flourishes in editorial image -->
  <circle cx="500" cy="280" r="180" stroke="url(#coupleGold)" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Silhouettes of Vijayraghav & Keerthana looking lovingly at each other -->
  <g transform="translate(500, 310)">
    <!-- Heart Glow in background -->
    <path d="M 0 -20 C 0 -70, -60 -70, -60 -20 C -60 30, 0 80, 0 80 C 0 80, 60 30, 60 -20 C 60 -70, 0 -70, 0 -20 Z" fill="#d4af37" opacity="0.12"/>

    <!-- Couple Monogram Crest -->
    <text x="0" y="-30" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="54" font-weight="700" fill="url(#coupleGold)" text-anchor="middle">V &amp; K</text>
    <text x="0" y="25" font-family="'Great Vibes', cursive" font-size="42" fill="#fffbe8" text-anchor="middle">Vijayraghav &amp; Keerthana</text>
    <text x="0" y="65" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#deb853" text-anchor="middle" letter-spacing="5">13 DECEMBER 2026 • KARUR</text>
  </g>

  <!-- Auspicious Tamil Verse / Blessings -->
  <text x="500" y="520" font-family="'Cormorant Garamond', serif" font-size="22" font-style="italic" fill="#faf5eb" text-anchor="middle">
    "Two lives joined by faith, destined by tradition, blessed for eternity."
  </text>
</svg>

