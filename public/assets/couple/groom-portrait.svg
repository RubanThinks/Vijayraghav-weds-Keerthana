<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="groomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#19284d"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="goldBorderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6112"/>
    </linearGradient>
    <linearGradient id="silkKurta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ea"/>
      <stop offset="50%" stop-color="#f0e2ca"/>
      <stop offset="100%" stop-color="#e3cbab"/>
    </linearGradient>
    <linearGradient id="groomSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecc6a8"/>
      <stop offset="100%" stop-color="#dbaa84"/>
    </linearGradient>
  </defs>

  <!-- Editorial Background -->
  <rect width="100%" height="100%" fill="url(#groomBg)"/>

  <!-- Ornate Frame -->
  <rect x="25" y="25" width="550" height="750" stroke="url(#goldBorderG)" stroke-width="2" fill="none"/>
  <rect x="35" y="35" width="530" height="730" stroke="url(#goldBorderG)" stroke-width="0.8" stroke-dasharray="6 4" fill="none"/>

  <!-- Groom Illustration in Pure Silk Pattu Kurta & Angavastram -->
  <g id="groomFigure" transform="translate(300, 360)">
    <!-- Silk Shoulders & Kurta -->
    <path d="M -160 300 L -120 110 C -70 80, 70 80, 120 110 L 160 300 Z" fill="url(#silkKurta)" stroke="url(#goldBorderG)" stroke-width="2"/>

    <!-- Auspicious Golden Zari Angavastram (Silk Stole) -->
    <path d="M -90 100 C -60 170, -70 260, -95 380 L -30 390 C -15 280, 0 170, -30 95 Z" fill="#fff8e7" stroke="url(#goldBorderG)" stroke-width="2.5"/>
    <line x1="-90" y1="120" x2="-35" y2="115" stroke="#d4af37" stroke-width="3"/>
    <line x1="-92" y1="130" x2="-33" y2="125" stroke="#d4af37" stroke-width="2"/>
    <line x1="-95" y1="370" x2="-30" y2="380" stroke="#d4af37" stroke-width="5"/>

    <!-- Neck & Face -->
    <path d="M -30 50 L -30 100 C -10 110, 10 110, 30 100 L 30 50 Z" fill="url(#groomSkin)"/>
    <path d="M -50 -50 C -60 10, -45 60, 0 65 C 45 60, 60 10, 50 -50 C 40 -80, -40 -80, -50 -50 Z" fill="url(#groomSkin)"/>

    <!-- Hair -->
    <path d="M -55 -45 C -55 -105, 55 -105, 55 -45 C 50 -70, -50 -70, -55 -45 Z" fill="#1b1715"/>
    <path d="M -55 -45 Q -58 -10 -48 10 Q -45 -10 -40 -30 Z" fill="#1b1715"/>
    <path d="M 55 -45 Q 58 -10 48 10 Q 45 -10 40 -30 Z" fill="#1b1715"/>

    <!-- Eyes & Eyebrows -->
    <path d="M -35 -20 Q -22 -26 -10 -20" stroke="#1b1715" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 10 -20 Q 22 -26 35 -20" stroke="#1b1715" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="-12" r="3.5" fill="#2b1a13"/>
    <circle cx="22" cy="-12" r="3.5" fill="#2b1a13"/>

    <!-- Auspicious Santhanam & Kumkum Tilak -->
    <circle cx="0" cy="-35" r="2.8" fill="#d90429"/>
    <line x1="-8" y1="-39" x2="8" y2="-39" stroke="#ffbe0b" stroke-width="1.8"/>

    <!-- Gentle Confident Smile -->
    <path d="M -15 25 Q 0 35 15 25" stroke="#9d4edd" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Groom Gold Chain -->
    <path d="M -25 90 Q 0 125 25 90" stroke="url(#goldBorderG)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(300, 710)">
    <rect x="-140" y="-35" width="280" height="50" rx="4" fill="#060a14" stroke="url(#goldBorderG)" stroke-width="1.5"/>
    <text x="0" y="-8" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="url(#goldBorderG)" text-anchor="middle" letter-spacing="3">VIJAYRAGHAV</text>
    <text x="0" y="10" font-family="'Montserrat', sans-serif" font-size="10" font-weight="500" fill="#f4e4b5" text-anchor="middle" letter-spacing="4">THE GROOM</text>
  </g>
</svg>

